name: CI
on:
  pull_request:
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run quality:sonarjs
      - run: npm run build
      - run: npm run test:observability-local
      - run: npm run test:cov -- --watchman=false
      - run: npm run test:coverage-infrastructure -- --watchman=false
      - run: npm run test:contracts
      - run: npm run test:delivery
      - name: Verificar imagem e trava da recuperação
        run: |
          docker build -t execution-ci:${{ github.sha }} .
          if output="$(docker run --rm --entrypoint node execution-ci:${{ github.sha }} scripts/operations/recover-outbox.cjs 2>&1)"; then
            echo 'Recuperação não deveria executar sem habilitação'; exit 1
          fi
          [[ "$output" == *'Recuperação recusada ou indisponível'* ]] || { echo 'Ferramenta ausente ou inválida'; exit 1; }
      - run: kubectl kustomize deploy/kustomize/overlays/hml > /tmp/service-hml.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: execution-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
  publish:
    name: Publicar imagem Execution aprovada
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && vars.HML_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/joaogw/soat-execution-service:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
  deploy_hml:
    name: Deploy Execution HML
    needs: publish
    runs-on: ubuntu-latest
    environment: hml
    concurrency:
      group: execution-deploy-hml
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Impedir deploy de revisão ultrapassada
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/development" --jq '.object.sha')"
          [[ "$current" == "$APPROVED_SHA" && "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]] || { echo 'A branch avançou ou o checkout não corresponde ao CI'; exit 1; }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
      - name: Preparar cluster e validar pré-requisitos
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
        run: |
          az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl -n hml get secret soat-ghcr-pull soat-execution-runtime >/dev/null
      - name: Aplicar exatamente a imagem do SHA aprovado
        env:
          WORKLOAD_CLIENT_ID: ${{ vars.EXECUTION_WORKLOAD_CLIENT_ID }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          [[ "$WORKLOAD_CLIENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          kubectl kustomize deploy/kustomize/overlays/hml > "$RUNNER_TEMP/rendered.yaml"
          sed -i "s/__WORKLOAD_CLIENT_ID__/$WORKLOAD_CLIENT_ID/g; s/sha-not-set/$IMAGE_SHA/g" "$RUNNER_TEMP/rendered.yaml"
          if grep -Eq '__WORKLOAD_CLIENT_ID__|sha-not-set' "$RUNNER_TEMP/rendered.yaml"; then echo 'Manifesto incompleto'; exit 1; fi
          kubectl apply -f "$RUNNER_TEMP/rendered.yaml"
          kubectl -n hml rollout status deployment/soat-execution-service --timeout=300s
