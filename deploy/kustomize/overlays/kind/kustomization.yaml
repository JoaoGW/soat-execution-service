apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Ambiente efêmero do pipeline: cluster kind criado no runner, sem Azure.
# Sem identidade de workload o acesso ao Cosmos permanece fechado (503).
namespace: soat-kind
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: soat-execution-service
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: remove
        path: /spec/template/metadata/labels/azure.workload.identity~1use
  - target:
      kind: ServiceAccount
      name: soat-execution-service
    patch: |-
      - op: remove
        path: /metadata/annotations
